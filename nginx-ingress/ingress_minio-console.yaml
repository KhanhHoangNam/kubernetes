apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:    
  name: minio-console.khanhhn.com.vn  
spec:
  ingressClassName: nginx
  rules:
  - host: minio-console.khanhhn.com.vn
    http:
      paths:
      - backend:
          service:
            name: console
            port:
              number: 9090
        path: /
        pathType: Prefix